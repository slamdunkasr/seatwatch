name: test-notify
# Runs one REAL check and sends a test notification with the class search snapshot attached.
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml beautifulsoup4 playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: One live check + test push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py --test
