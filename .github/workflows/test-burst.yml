name: test-burst
# Sends 5 test notifications, one every 2 minutes, to prove the alerts reach your phone.
on: workflow_dispatch
jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Send test alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          for i in 1 2 3 4 5; do
            curl -s -H "Title: Seat watch test $i of 5" -H "Priority: high" -H "Tags: bell" \
              -d "Test alert $i/5 at $(TZ=America/Los_Angeles date +%I:%M%p). Seat watch is running." \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null && echo "sent $i"
            [ $i -lt 5 ] && sleep 120
          done
