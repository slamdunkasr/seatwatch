name: seatwatch
# A long-running job checks every 2 minutes for ~5h45m, then restarts itself.
# The hourly schedule is only a backup in case the loop ever stops.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: seatwatch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml beautifulsoup4
      - name: Watch seats (every 2 min)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INTERVAL_SEC: "120"
          LOOP_MINUTES: "340"
        run: |
          git config user.name seatwatch-bot
          git config user.email seatwatch-bot@users.noreply.github.com
          python watch.py ${{ inputs.test && '--test' || '' }}
      - name: Restart the loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run seatwatch.yml --ref main
